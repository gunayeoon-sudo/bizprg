<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>홍길동 - 자기소개</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .avatar {
            width: 90px;
            height: 90px;
            background-color: #4f46e5;
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            margin: 0 auto 20px auto;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #111;
        }
        .major {
            font-size: 16px;
            color: #4f46e5;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .description {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">홍</div>
        <h1>홍길동</h1>
        <div class="major">경영정보학과</div>
        <p class="description">
            안녕하세요! 경영과 IT의 융합을 배우며, 데이터와 기술을 통해 비즈니스 가치를 창출하는 것에 관심이 많은 경영정보학과 학생 홍길동입니다.
        </p>
    </div>

</body>
</html>
